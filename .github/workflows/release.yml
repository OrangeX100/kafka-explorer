# Release pipeline: pushing a v* tag builds the single-file installer and
# publishes it as a GitHub Release with its .sha256 sidecar (the in-app
# updater verifies that checksum before installing).
#
# ISCC comes from chocolatey's innosetup package; the task passes the tag
# as VERSION (the pre-release suffix is dropped for the numeric
# VersionInfoVersion by the sync scripts' semver parsing).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI and Inno Setup
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          choco install innosetup -y --no-progress
          # installer image script needs Pillow; the runner only ships stdlib
          python -m pip install --quiet --disable-pip-version-check pillow

      - name: Build installer
        shell: bash
        env:
          # PATH for the wails3 CLI installed above
          GOPATH: ${{ github.workspace }}/go
        run: |
          export PATH="$GOPATH/bin:$PATH"
          # choco puts Inno Setup machine-wide; the Taskfile default points
          # at a per-user install, so probe both before invoking the task
          ISCC_PATH="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC_PATH" ] || ISCC_PATH="$LOCALAPPDATA/Programs/Inno Setup 6/ISCC.exe"
          ISCC_PATH=$(cygpath -m "$ISCC_PATH")
          echo "ISCC: $ISCC_PATH"
          # wails TS bindings are a gitignored generated artifact; the gate
          # regenerates them before every build, installer alone does not
          wails3 task generate:bindings
          VERSION="${GITHUB_REF_NAME#v}"
          wails3 task installer VERSION="$VERSION" \
            VERSIONINFOVERSION="$VERSION.0" \
            RELEASE_REPO="${GITHUB_REPOSITORY}" \
            ISCC="$ISCC_PATH"

      - name: Versioned asset + checksum
        shell: bash
        working-directory: bin/installer
        run: |
          # the versioned name is what users download AND what the in-app
          # updater pattern-matches — the sidecar must match that name
          mv KafkaExplorer_Setup.exe "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe"
          SHA=$(certutil -hashfile "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe" SHA256 | sed -n 2p | tr -d ' ')
          echo "$SHA  KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe" > "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe.sha256"
          cat "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe.sha256"

      - name: Publish release
        shell: bash
        working-directory: bin/installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Kafka Explorer ${GITHUB_REF_NAME#v}" \
            --notes "See the repository README for the full capability list. SHA-256 is in the .sha256 sidecar." \
            --latest \
            "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe" \
            "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe.sha256"
