# Release pipeline: pushing a v* tag builds the single-file installer and
# publishes it as a GitHub Release with its .sha256 sidecar (the in-app
# updater verifies that checksum before installing).
#
# ISCC comes from chocolatey's innosetup package; the task passes the tag
# as VERSION (the pre-release suffix is dropped for the numeric
# VersionInfoVersion by the sync scripts' semver parsing).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # UI probes gate the publish: the update chain has broken five times and
  # every break reached users — no release ships without the probes passing.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-probe
        with:
          # cluster probes (connect/messages/groups/registry paths) run only
          # when the repo secret points at the test broker — KE_E2E_KAFKA is
          # a SECRET so the address stays private on a public repo
          kafka: ${{ secrets.KE_E2E_KAFKA }}
          update-flow: "1"
          # The gate runs BEFORE gh release create flips --latest, so the
          # probe stamp == published latest and the honest update verdict is
          # "已是最新" — accept that state here (release.yml P2-4 review);
          # develop CI keeps stamp < latest and drives the download chain.
          update-gate: "1"

  release:
    needs: [e2e]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI and Inno Setup
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          choco install innosetup -y --no-progress
          # installer image script needs Pillow; the runner only ships stdlib
          python -m pip install --quiet --disable-pip-version-check pillow

      - name: Build installer
        shell: bash
        env:
          # PATH for the wails3 CLI installed above
          GOPATH: ${{ github.workspace }}/go
        run: |
          export PATH="$GOPATH/bin:$PATH"
          # choco puts Inno Setup machine-wide; the Taskfile default points
          # at a per-user install, so probe both before invoking the task
          ISCC_PATH="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC_PATH" ] || ISCC_PATH="$LOCALAPPDATA/Programs/Inno Setup 6/ISCC.exe"
          ISCC_PATH=$(cygpath -m "$ISCC_PATH")
          echo "ISCC: $ISCC_PATH"
          # wails TS bindings are a gitignored generated artifact; the gate
          # regenerates them before every build, installer alone does not
          wails3 task generate:bindings
          VERSION="${GITHUB_REF_NAME#v}"
          wails3 task installer VERSION="$VERSION" \
            VERSIONINFOVERSION="$VERSION.0" \
            RELEASE_REPO="${GITHUB_REPOSITORY}" \
            ISCC="$ISCC_PATH"

      - name: Sign installer (skipped without credentials)
        if: vars.SIGN_BACKEND != ''
        shell: pwsh
        working-directory: bin/installer
        env:
          SIGN_BACKEND: ${{ vars.SIGN_BACKEND }}
          AZURE_RESOURCE_GROUP: ${{ vars.SIGN_AZURE_RESOURCE_GROUP }}
          AZURE_ACCOUNT: ${{ vars.SIGN_AZURE_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.SIGN_AZURE_PROFILE }}
          AZURE_ENDPOINT: ${{ vars.SIGN_AZURE_ENDPOINT }}
          CERT_NAME: ${{ vars.SIGN_CERT_NAME }}
          CERT_THUMBPRINT: ${{ vars.SIGN_CERT_THUMBPRINT }}
          AZURE_CLIENT_ID: ${{ secrets.SIGN_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.SIGN_AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SIGN_AZURE_CLIENT_SECRET }}
        run: |
          # 签名必须在 sidecar/latest.json 生成之前：签名改变文件字节，
          # 三方校验（exe/manifest/sidecar）读取的都是签名后的哈希。
          # 目标 = 未版本化名（mv 尚未发生）。
          $exe = "KafkaExplorer_Setup.exe"
          pwsh -File ../../scripts/sign.ps1 -Backend "$env:SIGN_BACKEND" `
            -Exe $exe `
            -AzureResourceGroup "$env:SIGN_AZURE_RESOURCE_GROUP" `
            -AzureAccount "$env:SIGN_AZURE_ACCOUNT" `
            -AzureProfile "$env:SIGN_AZURE_PROFILE" `
            -AzureEndpoint "$env:SIGN_AZURE_ENDPOINT" `
            -CertName "$env:SIGN_CERT_NAME" `
            -CertThumbprint "$env:SIGN_CERT_THUMBPRINT"

      - name: Versioned asset + checksum
        shell: bash
        working-directory: bin/installer
        run: |
          # the versioned name is what users download AND what the in-app
          # updater pattern-matches — the sidecar must match that name
          mv KafkaExplorer_Setup.exe "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe"
          SHA=$(certutil -hashfile "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe" SHA256 | sed -n 2p | tr -d ' ')
          echo "$SHA  KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe" > "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe.sha256"
          cat "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe.sha256"

      - name: Update manifest (latest.json)
        shell: bash
        working-directory: bin/installer
        run: |
          # the in-app updater reads THIS static file as its primary check
          # source (releases/latest/download/latest.json) — no GitHub API
          # quota involved. Keep the fields in sync with
          # internal/application update_service.go releaseManifest.
          SIZE=$(stat -c %s "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe")
          # assetSHA256 lets the in-app updater verify the download against
          # the manifest itself (no sidecar round-trip, no missing-sidecar
          # downgrade path) — keep the field names in sync with
          # internal/application update_service.go releaseManifest.
          SHA=$(sed -n 2p < <(certutil -hashfile "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe" SHA256) | tr -d ' ')
          cat > latest.json <<EOF
          {
            "tagName": "${GITHUB_REF_NAME}",
            "notes": "Kafka Explorer ${GITHUB_REF_NAME#v}。安装包含卸载器与自动更新；安装包 SHA-256 已内嵌于本文件并与 .sha256 附件一致。详见仓库 README。",
            "assetName": "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe",
            "assetSize": ${SIZE},
            "assetSHA256": "${SHA}"
          }
          EOF
          cat latest.json

      - name: Publish release
        shell: bash
        working-directory: bin/installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Kafka Explorer ${GITHUB_REF_NAME#v}" \
            --notes "See the repository README for the full capability list. SHA-256 is in the .sha256 sidecar." \
            --latest \
            "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe" \
            "KafkaExplorer_Setup_${GITHUB_REF_NAME#v}.exe.sha256" \
            "latest.json"

      # CN static mirror: sync the installer + manifest to OUR OWN Tencent
      # server (nginx :18080, /var/www/kafka-explorer/releases) — the
      # updater's domestic-first route (review 2026-11-22: public gh-proxy
      # instances die/rate-limit; Gitee attachments are login-walled).
      # Credentials ride Actions secrets and never touch the repo.
      - name: Sync CN mirror (Tencent server)
        shell: bash
        env:
          CN_SSH_HOST: 110.40.185.78
          CN_SSH_PORT: "22"
          CN_SSH_USER: root
          CN_SSH_PASSWORD: ${{ secrets.CN_MIRROR_SSH_PASSWORD }}
        run: |
          python -m pip install --quiet paramiko
          python - <<'PY'
          import os, paramiko
          ssh = paramiko.SSHClient()
          ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          ssh.connect(os.environ["CN_SSH_HOST"], port=int(os.environ["CN_SSH_PORT"]), username=os.environ["CN_SSH_USER"], password=os.environ["CN_SSH_PASSWORD"], timeout=20)
          run = lambda c: ssh.exec_command(c, timeout=120)[1].read().decode()
          print("mkdir:", run("mkdir -p /var/www/kafka-explorer/releases"))
          sftp = ssh.open_sftp()
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          for f in [f"KafkaExplorer_Setup_{ver}.exe", f"KafkaExplorer_Setup_{ver}.exe.sha256", "latest.json"]:
              sftp.put(f, f"/var/www/kafka-explorer/releases/{f}")
              print("uploaded", f)
          sftp.close()
          print("hash:", run(f"sha256sum /var/www/kafka-explorer/releases/KafkaExplorer_Setup_{ver}.exe"))
          ssh.close()
          PY
