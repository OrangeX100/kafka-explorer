name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  gate:
    # Same entry point as local dev: task precommit. No divergence.
    # Windows only: the shipped artifact is the Windows installer, and the
    # wails3 CLI itself needs GTK4/webkitgtk system packages to compile on
    # Linux/macOS runners — nothing else in the gate needs the extra OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Run precommit gate (generate + audits + build + test)
        run: wails3 task precommit

      # The test binaries were built to fixed paths for the AV workaround;
      # they are noise for the cache, not artifacts. shell: bash — the
      # Windows default (pwsh) rejects `rm -rf` as an unknown parameter.
      - name: Clean gate scratch
        if: always()
        shell: bash
        run: rm -rf .gotmp || true

  # UI probes on every push: build a CDP-enabled debug binary (0.4.10 stamp —
  # below the published latest), launch it on the runner, and run the
  # non-cluster suite (shell boot / isWindows regression / settings echo /
  # the REAL update chain). Cluster probes run only when the repo variable
  # KE_E2E_KAFKA points at a reachable broker (honest skips otherwise).
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-probe
        with:
          kafka: ${{ vars.KE_E2E_KAFKA }}
          update-flow: "1"
