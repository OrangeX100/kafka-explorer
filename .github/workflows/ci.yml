name: CI

# 与 release.yml 共用 e2e-cluster 组：两个 workflow 的探针作业打同一个
# 共享测试集群，并发时 browse 延迟尖峰叠加（0.4.20 两条 flaky 的放大器，
# 0.4.21 评审 P2-1）。串行排队，后跑的重新 checkout 必带新引用。
concurrency:
  group: e2e-cluster
  cancel-in-progress: false

on:
  pull_request:
    # opened/synchronize 每次推提交都会跑；这里去掉 synchronize 与 push
    # 轮的双跑（同 commit 合入时 PR 轮 + push 轮曾双倍打集群，P3-9）
    types: [opened, reopened]
  push:
    branches: [main, develop]

jobs:
  gate:
    # Same entry point as local dev: task precommit. No divergence.
    # Windows only: the shipped artifact is the Windows installer, and the
    # wails3 CLI itself needs GTK4/webkitgtk system packages to compile on
    # Linux/macOS runners — nothing else in the gate needs the extra OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # probe_contract_test.go resolves the probe base from release
          # tags; the default shallow checkout (fetch-depth: 1) leaves the
          # runner with ZERO tags and the contract silently skipped its
          # entire first CI round. fetch-tags: true alone is NOT enough on
          # a depth-1 fetch (observed: it only drops `--no-tags` from the
          # single-ref fetch; git auto-follows only tags pointing at
          # commits inside the shallow history — none). fetch-depth: 0
          # fetches all history for all branches AND tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Run precommit gate (generate + audits + build + test)
        run: wails3 task precommit

      # The test binaries were built to fixed paths for the AV workaround;
      # they are noise for the cache, not artifacts. shell: bash — the
      # Windows default (pwsh) rejects `rm -rf` as an unknown parameter.
      - name: Clean gate scratch
        if: always()
        shell: bash
        run: rm -rf .gotmp || true

  # UI probes on every push: build a CDP-enabled debug binary (probe-base stamp —
  # below the published latest; the base rides the release tag cadence), launch it on the runner, and run the
  # non-cluster suite (shell boot / isWindows regression / settings echo /
  # the REAL update chain). Cluster probes run only when the repo secret
  # KE_E2E_KAFKA points at a reachable broker (honest skips otherwise).
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-probe
        with:
          kafka: ${{ secrets.KE_E2E_KAFKA }}
          cn-ssh-password: ${{ secrets.CN_MIRROR_SSH_PASSWORD }}
          cn-ssh-host: ${{ secrets.CN_SSH_HOST }}
          cn-ssh-user: ${{ secrets.CN_SSH_USER }}
          update-flow: "1"
