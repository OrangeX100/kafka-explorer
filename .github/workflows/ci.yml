name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    # Same entry point as local dev: task precommit. No divergence.
    # Windows only: the shipped artifact is the Windows installer, and the
    # wails3 CLI itself needs GTK4/webkitgtk system packages to compile on
    # Linux/macOS runners — nothing else in the gate needs the extra OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Run precommit gate (generate + audits + build + test)
        run: wails3 task precommit

      # The test binaries were built to fixed paths for the AV workaround;
      # they are noise for the cache, not artifacts.
      - name: Clean gate scratch
        if: always()
        run: rm -rf .gotmp || true
