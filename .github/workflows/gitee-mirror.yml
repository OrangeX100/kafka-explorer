# Gitee code mirror: keeps gitee.com/OrangeX100/kafka-explorer in lockstep
# with this repo (main + develop + release tags) — dual publishing per
# 2026-11-22 user decision. Force-with-lease is REQUIRED on the first sync
# (Gitee's auto_init commit has unrelated history) and harmless afterwards;
# GITEE_TOKEN rides Actions secrets and never touches the repo.
name: gitee-mirror

on:
  push:
    branches: [main, develop]
    tags: ["v*"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # --force (NOT --force-with-lease): a fresh runner checkout has NO
          # gitee remote-tracking refs, so the lease ALWAYS reads "stale
          # info" and fails (2026-11-22: every mirror run red from this).
          # The Gitee repo is a pure mirror — force is the intent.
          git remote add gitee "https://OrangeX100:${GITEE_TOKEN}@gitee.com/OrangeX100/kafka-explorer.git"
          git push gitee --force origin/main:master
          git push gitee --force origin/develop:develop
          git push gitee --force origin "refs/tags/v*:refs/tags/v*"
