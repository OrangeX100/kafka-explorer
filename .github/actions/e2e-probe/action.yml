# Reusable UI-probe job body: builds a CDP-enabled debug binary with the
# probe-base stamp (随版迁移，见 probe_contract_test.go——不写具体版本
# 字面量，set_version.py 只重写 ldflags 那一行) — BELOW the published
# latest so the update-flow probe drives the REAL production feed, launches it with the double-gated debug port, and
# runs the Playwright suite. Cluster probes run only when the `kafka` input
# points at a reachable broker; the rest run everywhere.
name: e2e-probe
description: Build debug exe + run Playwright UI probes over CDP
inputs:
  kafka:
    description: "host:port of a reachable Kafka broker (empty = cluster probes skip). Pass a SECRET, not a var — a var would publish the test-cluster address on a public repo"
    required: false
    default: ""
  update-flow:
    description: "Set '1' to run the full discover→download→cancel update chain"
    required: false
    default: "1"
  update-gate:
    description: "Set '1' in RELEASE gates: the probe stamp equals published latest there (gh release create runs after e2e), so the honest '已是最新' verdict passes instead of skipping. Never set in develop CI — a mis-stamped build must stay visible."
    required: false
    default: ""
  cn-ssh-password:
    description: "Password for the CN static mirror server — enables the pre-probe purge of leaked e2e-* topics (shared cluster pagination drift). Empty = purge honestly skips."
    required: false
    default: ""
  cn-ssh-host:
    description: "CN server host — previously hardcoded in this file, which published root@IP to a public repo (0.4.20 review P2-5). Empty = purge honestly skips."
    required: false
    default: ""
  cn-ssh-user:
    description: "CN server ssh user — rides secrets like the host/password. Empty = purge honestly skips."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.27"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install wails3 CLI
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

    - name: Build frontend + debug binary with CDP stamps
      shell: bash
      env:
        GOPATH: ${{ github.workspace }}/go
      run: |
        export PATH="$GOPATH/bin:$PATH"
        # bindings are a gitignored generated artifact — regenerate first
        wails3 task generate:bindings
        cd frontend && npm ci --no-audit --no-fund && npm run build && cd ..
        # VERSION=<probe base> < published latest → the update-flow probe walks the
        # REAL discover→download→cancel chain against the production feed.
        # UpdateRepo matches the release stamp (settings.Get falls back to it).
        # DebugFeatures=cdp is the ONLY gate that lets KE_DEBUG_CDP open the
        # debug port (internal/buildinfo.DebugFeatures) — release builds ship
        # with it empty.
        # CGO_ENABLED=0 matches the release pipeline (Taskfile build pins
        # the same flag): the 2025-11 runner image update flipped Go's
        # default to CGO_ENABLED=1 (mingw on PATH), and the CGO debug build
        # created the WebView2 environment but never opened its window —
        # the CDP port never came up. This comment documents the CI-side
        # pin; the Taskfile is the single source both paths share.
        CGO_ENABLED=0 go build -trimpath -ldflags "-H=windowsgui -X kafkaexplorer/internal/buildinfo.Version=0.4.20 -X kafkaexplorer/internal/buildinfo.Commit=${GITHUB_SHA:0:7} -X kafkaexplorer/internal/buildinfo.UpdateRepo=OrangeX100/kafka-explorer -X kafkaexplorer/internal/buildinfo.DebugFeatures=cdp" -o bin/kafka-explorer-cdp.exe .

    # Keep the RUNNER display awake: WebView2's render pipeline freezes
    # when the interactive session's monitor suspends — round-11 evidence:
    # every Playwright protocol call (click/expect/evaluate) hung silently
    # for the full test budget on 4 consecutive runs, timing-correlated
    # with boot toast triggers, while all local runs passed. These are
    # session-level OS settings (fire-and-forget, never block node).
    - name: Disable runner display sleep
      shell: powershell
      run: |
        powercfg /change monitor-timeout-ac 0
        powercfg /change standby-timeout-ac 0
        powercfg /change hibernate-timeout-ac 0
        Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name ScreenSaveActive -Value '0'

    - name: Launch app with CDP port
      shell: bash
      run: |
        # WebView2 后台节流/挂起是 CI 独有挂死根因（2026-11-21 实证：runner
        # 上 app 窗口被遮挡，page.evaluate 静默停摆 ~5min 再恢复，goto 两连
        # 300s 整卡死而本地前台全过；v0.4.12 的 rAF 前台化只救了 actiona-
        # bility，救不了 renderer backgrounding 的 evaluate 停摆）。三个
        # Chromium 开关禁掉：定时器节流 + 渲染器 backgrounding + 遮挡挂起。
        export WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="--disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows"
        KE_DEBUG_CDP=1 ./bin/kafka-explorer-cdp.exe &
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:9223/json/version >/dev/null 2>&1; then ok=1; break; fi
          sleep 2
        done
        if [ "$ok" != "1" ]; then
          echo "::error::CDP 端口 9223 60 秒内未就绪（检查 WebView2 Runtime 与单实例锁）"
          exit 1
        fi
        echo "CDP ready on 127.0.0.1:9223"

    # Purge leaked e2e-* topics from the shared cluster BEFORE probes:
    # a day of CI rounds leaks enough topics to push the list past 50/page
    # and UNSCOPED row clicks hang on invisible page-2 rows (2026-11-22
    # evidence: 6min hangs ×3 after crossing the threshold). Honest skip
    # without the password — local runs purge via scripts/cleanup-e2e-topics.py.
    - name: Purge leaked e2e topics
      # best-effort by design: GitHub runners are often RESET by CN-server
      # sshd/firewall (ConnectionReset on banner, 2026-11-22) — the probes
      # must run regardless; openTopic is filter-scoped so drift is already
      # tolerated. Local runs purge via scripts/cleanup-e2e-topics.py.
      continue-on-error: true
      shell: bash
      env:
        CN_SSH_HOST: ${{ inputs.cn-ssh-host }}
        CN_SSH_PORT: "22"
        CN_SSH_USER: ${{ inputs.cn-ssh-user }}
        CN_SSH_PASSWORD: ${{ inputs.cn-ssh-password }}
      run: |
        python -m pip install --quiet paramiko==3.11.0  # 钉版：该步骤运行在持有 CN_SSH_* secrets 的 env（0.4.21 P3-7）
        python - <<'PY'
        import os, paramiko
        pw = os.environ.get("CN_SSH_PASSWORD", "")
        host = os.environ.get("CN_SSH_HOST", "")
        user = os.environ.get("CN_SSH_USER", "")
        if not (pw and host and user):
            print("CN_SSH_* 未提供齐全——泄漏主题预清理诚实跳过")
            raise SystemExit(0)
        ssh = paramiko.SSHClient()
        ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
        ssh.connect(host, port=int(os.environ["CN_SSH_PORT"]),
                    username=user, password=pw, timeout=20)
        def run(c, t=120):
            return ssh.exec_command(c, timeout=t)[1].read().decode()
        list_cmd = "docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9096 --list"
        names = run(list_cmd).split()
        # 只删陈旧主题：RUN_ID 内嵌 base36 毫秒时间戳（helpers.ts:24），
        # >2h 才删——防 main+develop 双 run 并发时互删对方在用主题
        # （2026-11-22 实证互踩）。无时间戳后缀/解析失败一律跳过。
        import time as _t
        now_ms = int(_t.time() * 1000)
        stale = []
        for n in names:
            # RUN_ID 是第二段：e2e-<base36毫秒时间戳>-<后缀>（helpers.ts:24）
            parts = n.split("-")
            if len(parts) < 2 or parts[0] != "e2e":
                continue
            try:
                ts = int(parts[1], 36)
            except ValueError:
                stale.append(n)  # 解析失败的老泄漏：删
                continue
            if now_ms - ts > 2 * 3600 * 1000:
                stale.append(n)
        print("stale topics:", len(stale), "of", len([n for n in names if n.startswith('e2e-')]))
        for n in stale:
            run(f"docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9096 --delete --topic {n}")
        # 删除校验（0.4.20 review P2-4）：--delete 成功 ≠ 已消失（控制器
        # 异步）。残留打 ::warning（继续不阻塞探针），防漏删静默回归。
        left = [n for n in run(list_cmd).split() if n in stale]
        if left:
            print("::warning::purge 后仍残留 %d 个 e2e-* 主题（控制器异步删除或删除失败）: %s" % (len(left), ",".join(left[:10])))
        print("purged")
        ssh.close()
        PY

    - name: Run Playwright UI probes
      shell: bash
      env:
        KE_E2E_KAFKA: ${{ inputs.kafka }}
        KE_E2E_UPDATE_FLOW: ${{ inputs.update-flow }}
        KE_UPDATE_GATE: ${{ inputs.update-gate }}
        KE_APP_DIR: ${{ github.workspace }}/bin
      # retries live in playwright.config.ts (CI→2, single source) — the
      # hardcoded --retries=1 here silently overrode it (2026-11-21: three-
      # attempt budget never engaged, release run burned both attempts)
      run: cd frontend && npx playwright test

    - name: Upload probe failure context
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-error-context
        path: frontend/test-results/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload probe artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-probe-results
        path: |
          frontend/test-results/
          frontend/playwright-report/
        retention-days: 7
        if-no-files-found: ignore
