<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Kafka Explorer 卸载</title>
</head>
<body>
  <!-- frameless window: this header is the draggable titlebar -->
  <header class="titlebar" style="--wails-draggable: drag">
    <span class="title">Kafka Explorer 卸载</span>
    <button class="close" id="close" style="--wails-draggable: no-drag" title="关闭">✕</button>
  </header>

  <main class="content">
    <div class="left">
      <img class="logo" src="logo.png" alt="">
    </div>
    <div class="right">
      <h1 class="name">Kafka Explorer</h1>
      <p class="subtitle">集群可视化管理工具</p>

      <div id="optionsGroup">
        <label class="check">
          <input type="checkbox" id="deleteData">
          <span>同时删除用户数据（连接配置、密钥与设置）</span>
        </label>

        <p class="from">卸载自</p>
        <p class="path" id="path">正在读取安装信息…</p>
      </div>

      <p class="note" id="note"></p>

      <div class="actions">
        <button class="btn cancel" id="cancel">取消</button>
        <button class="btn primary" id="ok" disabled>卸载</button>
      </div>
      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
